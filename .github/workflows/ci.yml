name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Linux is the reference build for reproducibility (ADR 0001).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment (with the Phase 9 ml extra; CPU-only torch on Linux)
        run: uv sync --locked --extra ml
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Pipeline (stages that don't need raw data)
        run: make repro-ci
