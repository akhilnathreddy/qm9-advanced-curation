# Stage graph (plan v2 §8). Later phases add:
# parse -> validate -> tier -> features -> review -> splits -> benchmark
stages:
  env_report:
    cmd: python -m qm9_curation.env_report --out reports/gates/env.json
    deps:
      - src/qm9_curation/env_report.py
      - uv.lock
    outs:
      - reports/gates/env.json:
          cache: false

  # Downloads only what is missing; otherwise re-verifies size and MD5.
  # persist keeps DVC from deleting the raw files before re-running.
  acquire:
    cmd: python -m qm9_curation.acquire
    deps:
      - src/qm9_curation/acquire.py
      - configs/dataset.yaml
    outs:
      - data/raw/dsgdb9nsd.xyz.tar.bz2:
          persist: true
      - data/raw/uncharacterized.txt:
          persist: true
      - data/raw/atomref.txt:
          persist: true
      - data/raw/readme.txt:
          persist: true
      - data/raw/MANIFEST.json:
          cache: false
          persist: true

  inventory:
    cmd: python -m qm9_curation.inventory
    deps:
      - src/qm9_curation/inventory.py
      - configs/dataset.yaml
      - data/raw/dsgdb9nsd.xyz.tar.bz2
      - data/raw/uncharacterized.txt
      - data/raw/atomref.txt
    outs:
      - reports/data_quality/inventory.json:
          cache: false

  # Strict lossless parse into typed tables (ADR 0006).
  parse:
    cmd: python -m qm9_curation.parse.build
    deps:
      - src/qm9_curation/parse
      - src/qm9_curation/schema.py
      - data/raw/dsgdb9nsd.xyz.tar.bz2
      - data/raw/MANIFEST.json
    outs:
      - data/interim/molecules.parquet
      - data/interim/atoms.parquet
      - data/interim/frequencies.parquet
      - data/interim/parse_log.parquet
      - reports/data_quality/parse_report.json:
          cache: false

  profile:
    cmd: python -m qm9_curation.profiling.build
    deps:
      - src/qm9_curation/profiling
      - src/qm9_curation/schema.py
      - data/interim/molecules.parquet
      - data/interim/atoms.parquet
      - data/interim/frequencies.parquet
      - data/raw/uncharacterized.txt
    outs:
      - data/interim/molecule_profile.parquet
      - data/interim/geometric_duplicate_pairs.parquet
      - reports/data_quality/profile.json:
          cache: false
      - reports/data_quality/profile.html:
          cache: false

  # Four-layer validation (ADR 0008).
  validate:
    cmd: python -m qm9_curation.checks.build
    deps:
      - src/qm9_curation/checks
      - src/qm9_curation/parallel.py
      - src/qm9_curation/units.py
      - configs/validation.yaml
      - configs/dataset.yaml
      - data/interim/molecules.parquet
      - data/interim/atoms.parquet
      - data/interim/frequencies.parquet
      - data/interim/molecule_profile.parquet
      - data/raw/uncharacterized.txt
    outs:
      - data/interim/validation.parquet
      - reports/validation/validation_report.json:
          cache: false

  # Standardization, duplicate representatives and quality tiers (ADR 0009).
  curate:
    cmd: python -m qm9_curation.curate.build
    deps:
      - src/qm9_curation/curate
      - src/qm9_curation/parallel.py
      - src/qm9_curation/schema.py
      - src/qm9_curation/units.py
      - configs/curation_rules.yaml
      - data/interim/molecules.parquet
      - data/interim/atoms.parquet
      - data/interim/validation.parquet
      - data/interim/molecule_profile.parquet
      - data/raw/atomref.txt
    outs:
      - data/processed/molecules.parquet
      - reports/curation/curation_report.json:
          cache: false

  # Feature tables from atoms + coordinates only (ADR 0010).
  features:
    cmd: python -m qm9_curation.features.build
    deps:
      - src/qm9_curation/features
      - src/qm9_curation/parallel.py
      - src/qm9_curation/checks/identity.py
      - src/qm9_curation/profiling/geometry.py
      - data/interim/atoms.parquet
    outs:
      - data/processed/features
      - reports/features/feature_report.json:
          cache: false

  # External G4(MP2) reference tables of Kim et al. 2019 (CC0; ADR 0011).
  acquire_external:
    cmd: python -m qm9_curation.external.acquire
    deps:
      - src/qm9_curation/external/acquire.py
      - src/qm9_curation/acquire.py
      - configs/external.yaml
    outs:
      - data/external/kim2019/data_publication_main.v2.tar.gz:
          persist: true
      - data/external/kim2019/MANIFEST.json:
          cache: false
          persist: true

  # Statistical, scientific and multi-fidelity review; soft flags only (ADR 0011).
  review:
    cmd: python -m qm9_curation.review.build
    deps:
      - src/qm9_curation/review
      - src/qm9_curation/external/kim2019.py
      - src/qm9_curation/curate/build.py
      - src/qm9_curation/curate/tiers.py
      - src/qm9_curation/profiling/properties.py
      - src/qm9_curation/features/molecular.py
      - src/qm9_curation/units.py
      - configs/statistical.yaml
      - configs/external.yaml
      - configs/dataset.yaml
      - data/processed/molecules.parquet
      - data/processed/features
      - data/external/kim2019/data_publication_main.v2.tar.gz
      - data/external/kim2019/MANIFEST.json
    outs:
      - data/processed/review.parquet
      - data/processed/g4mp2_xref.parquet
      - reports/statistical/statistical_report.json:
          cache: false

  # Split suite with per-split leakage audit (ADR 0012).
  splits:
    cmd: python -m qm9_curation.splits.build
    deps:
      - src/qm9_curation/splits
      - src/qm9_curation/parallel.py
      - src/qm9_curation/review/stats.py
      - src/qm9_curation/features/molecular.py
      - configs/splits.yaml
      - data/processed/molecules.parquet
      - data/processed/features
    outs:
      - data/splits/splits.parquet
      - data/splits/split_groups.parquet
      - reports/splits/split_report.json:
          cache: false

  # Benchmark grid: tuning, RQ3 + stress splits, RQ2 OOF, RQ5 ablation (ADR 0013).
  # Resumable: each run is keyed by its spec and model parameters, and the run
  # directory persists, so a re-run only trains missing cells.
  benchmark:
    cmd: python -m qm9_curation.benchmark.run
    deps:
      - src/qm9_curation/benchmark/run.py
      - src/qm9_curation/benchmark/data.py
      - src/qm9_curation/benchmark/models.py
      - src/qm9_curation/benchmark/gnn.py
      - src/qm9_curation/benchmark/metrics.py
      - src/qm9_curation/benchmark/tracking.py
      - configs/benchmark.yaml
      - data/processed/molecules.parquet
      - data/processed/features
      - data/interim/atoms.parquet
      - data/splits/splits.parquet
      - data/splits/split_groups.parquet
    outs:
      - data/benchmark/runs:
          persist: true

  # Frozen-plan decision rules over the finished runs (deterministic).
  benchmark_analysis:
    cmd: python -m qm9_curation.benchmark.analysis
    deps:
      - src/qm9_curation/benchmark/analysis.py
      - src/qm9_curation/benchmark/metrics.py
      - src/qm9_curation/benchmark/models.py
      - src/qm9_curation/review/stats.py
      - configs/benchmark.yaml
      - docs/analysis_plan.md
      - data/benchmark/runs
      - data/processed/molecules.parquet
    outs:
      - data/benchmark/run_metrics.parquet
      - reports/benchmark/benchmark_report.json:
          cache: false
      - reports/benchmark/summary.md:
          cache: false
      - reports/benchmark/figures:
          cache: false
