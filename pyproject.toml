[project]
name = "qm9-curation"
version = "0.1.0"
description = "Research-grade, reproducible curation pipeline for the QM9 quantum-chemistry dataset."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "rdkit>=2024.3",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "certifi>=2026.10.23",
]

[project.optional-dependencies]
# Phase 9 benchmark models and run tracking; kept out of the default env so
# Phases 0-8 stay light. `uv sync --extra ml`.
ml = [
    "scikit-learn>=1.5",
    "mlflow-skinny>=2.14",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
    "pre-commit>=3.7",
    "dvc>=3.50",
]

# Linux (CI, the reference build) uses CPU-only torch wheels; macOS uses PyPI (CPU + MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qm9_curation"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `value == pytest.approx(expected)` is idiomatic pytest, not a Yoda condition.
"tests/**" = ["SIM300"]
# HTML/CSS template text; wrapping it would only hurt readability.
"src/qm9_curation/profiling/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["qm9_curation"]

[[tool.mypy.overrides]]
module = ["rdkit.*", "pandera.*", "scipy.*", "sklearn.*", "mlflow.*"]
ignore_missing_imports = true

# RDKit ships partial stubs; many functions are untyped.
[[tool.mypy.overrides]]
module = ["qm9_curation.profiling.chemistry", "qm9_curation.checks.identity", "qm9_curation.curate.standardize", "qm9_curation.features.molecular", "qm9_curation.review.scientific", "qm9_curation.splits.groups", "qm9_curation.splits.fingerprints"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pipeline: end-to-end tests that need the 1k fixture (populated in Phase 1)",
]
